name: VAULTIX buyer video production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vaultix-buyer-video.yml"
      - "buyer_video.py"
  schedule:
    - cron: "43 15 * * *"
  workflow_dispatch:
    inputs:
      build_full_queue:
        description: "Render all prepared buyer briefs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vaultix-buyer-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve due editorial brief
        id: brief
        env:
          FULL_QUEUE: ${{ inputs.build_full_queue }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          from bot import BUYER_CAMPAIGN_START, BUYER_POSTS

          today = datetime.now(timezone.utc).date()
          day = (today - BUYER_CAMPAIGN_START).days
          full = os.environ.get("FULL_QUEUE") == "true"
          due = full or 0 <= day < len(BUYER_POSTS)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("due=" + str(due).lower(), file=out)
              print("date=" + today.isoformat(), file=out)
          if not due:
              print("No approved editorial brief for this date.")
          PY
      - name: Install rendering dependencies
        if: steps.brief.outputs.due == 'true'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install --quiet 'Pillow==12.0.0'
      - name: Render and decode-check the buyer video
        if: steps.brief.outputs.due == 'true'
        env:
          FULL_QUEUE: ${{ inputs.build_full_queue }}
          EDITORIAL_DATE: ${{ steps.brief.outputs.date }}
        run: |
          if [[ "$FULL_QUEUE" == "true" ]]; then
            python buyer_video.py --all --output rendered
          else
            python buyer_video.py --date "$EDITORIAL_DATE" --output rendered
          fi
      - name: Save video and destination metadata
        if: steps.brief.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vaultix-buyer-video-${{ steps.brief.outputs.date }}
          path: rendered/
          if-no-files-found: error
          retention-days: 31
