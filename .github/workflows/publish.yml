name: AI FREE DROP - Publisher

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview content without publishing"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 6,11,15,20 * * *"

permissions:
  contents: write

concurrency:
  group: ai-free-drop-publisher
  cancel-in-progress: false

jobs:
  publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out publisher code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Python sources
        run: python -m compileall -q bot.py avatar.py branding.py bluesky.py discovery.py
      - name: Refresh AI FREE DROP profile and pinned welcome once
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-channel]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: python refresh_channel.py
      - name: Save new pinned welcome profile state
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-channel]') }}
        shell: bash
        run: |
          git add data/state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: record AIFREEDROP profile refresh [skip ci]"
            git push
          fi
      - name: Inspect public directory forms without submitting
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[inspect-forms]') }}
        run: python scripts/inspect_public_forms.py
      - name: Submit free TGMetrix and TeleSeeker forms once
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[submit-public-forms]') }}
        run: python scripts/submit_public_forms.py
      - name: Save verified public directory submission statuses
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[submit-public-forms]') }}
        shell: bash
        run: |
          git add data/directory_submissions.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: record public directory submission outcomes [skip ci]"
            git push
          fi
      - name: Submit to TGFind public directory (one-time opt-in)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[submit-tgfind]') }}
        run: python scripts/submit_tgfind.py
      - name: Submit to TGDirectory (only on explicitly tagged commit)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[submit-directory]') }}
        run: python scripts/submit_directory.py
      - name: Render original VAULTIX AI car vertical video (one-time)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[build-promo]') }}
        shell: bash
        run: |
          python -m pip install --quiet 'Pillow==12.0.0' 'imageio-ffmpeg==0.6.0'
          python promo_video.py
          python -c 'from pathlib import Path; p=Path("media/used_car_ai_prompt.mp4"); assert p.read_bytes()[4:8] == b"ftyp", "Not MP4"; print("Verified MP4 bytes:",p.stat().st_size)'
          test "$(stat -c%s media/used_car_ai_prompt.mp4)" -gt 300000
      - name: Save original VAULTIX video to this project
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[build-promo]') }}
        shell: bash
        run: |
          git add media/used_car_ai_prompt.mp4
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "media: store original VAULTIX promo clip [skip ci]"
            git push
          fi
      - name: Check royalty-free cinematic video sources (read-only)
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[probe-footage]') }}
        run: python scripts/check_licensed_footage.py
      - name: Build VAULTIX cinematic reel from original licensed moving footage
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[build-cinematic]') }}
        timeout-minutes: 7
        run: |
          python -m pip install --quiet 'imageio-ffmpeg==0.6.0' 'Pillow==12.0.0'
          python cinematic_v2.py
          python -c 'from pathlib import Path; p=Path("media/vaultix_cinematic_v2.mp4"); assert p.read_bytes()[:32][4:8]==b"ftyp"; print("MP4 checked:",p.stat().st_size)'
      - name: Save QA-ready cinematic preview to AI FREE DROP repo
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[build-cinematic]') }}
        shell: bash
        run: |
          git add media/vaultix_cinematic_v2.mp4
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "media: save cinematic VAULTIX reel for review [skip ci]"
            git push
          fi
      - name: Validate current official release feeds without publishing
        if: ${{ github.event_name == 'push' }}
        run: python bot.py --dry-run
      - name: Dry-run from the GitHub Actions UI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: python bot.py --dry-run
      - name: Publish live only if configured
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-live]')) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          BSKY_HANDLE: ${{ vars.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "::warning::NOT LIVE: configure a freshly rotated TELEGRAM_BOT_TOKEN in repository secrets."
            exit 0
          fi
          if [[ -z "$TELEGRAM_CHANNEL" ]]; then
            export TELEGRAM_CHANNEL="@AIFREEDROP"
          fi
          python bot.py
          if [[ -n "$BSKY_HANDLE" && -n "$BSKY_APP_PASSWORD" ]]; then
            python bluesky.py || echo "::warning::Optional Bluesky cross-post did not complete."
          fi
      - name: Refresh real channel member count without publishing
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[metrics-only]')) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: python metrics.py
      - name: Generate public release archive and Atom feed
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-live]')) }}
        run: python discovery.py
      - name: Commit compact state when changed
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-live]')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[metrics-only]')) }}
        shell: bash
        run: |
          git add data/state.json DROPS.md feed.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update release archive and metrics [skip ci]"
            git push
          fi
